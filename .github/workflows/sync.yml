name: Sync CCM release
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ccm-release-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_FROM_API: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select CCM's latest release
        id: latest
        shell: bash
        run: |
          set -euo pipefail
          tag=$(gh api repos/insanai/ccm/releases/latest --jq .tag_name)
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
          if [ -f RELEASE_TAG ] && [ "$(cat RELEASE_TAG)" = "$tag" ]; then
            echo 'update=false' >> "$GITHUB_OUTPUT"
          else
            echo 'update=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.latest.outputs.update == 'true'
        with:
          repository: insanai/ccm
          ref: ${{ steps.latest.outputs.tag }}
          path: .ccm-source
          persist-credentials: false
      - name: Generate the release formula
        if: steps.latest.outputs.update == 'true'
        shell: bash
        env:
          CCM_TAG: ${{ steps.latest.outputs.tag }}
        run: |
          set -euo pipefail
          gh release download "$CCM_TAG" --repo insanai/ccm --pattern SHA256SUMS --dir "$RUNNER_TEMP"
          rustup toolchain install 1.98.1 --profile minimal
          cd .ccm-source
          cargo +1.98.1 run --quiet --locked -p xtask -- homebrew \
            "$RUNNER_TEMP/SHA256SUMS" "$GITHUB_WORKSPACE/Formula/ccm.rb"
      - name: Install and test the formula
        if: steps.latest.outputs.update == 'true'
        shell: bash
        run: |
          set -euo pipefail
          brew tap-new --no-git ccm/release-check
          tap="$(brew --repository)/Library/Taps/ccm/homebrew-release-check"
          cp Formula/ccm.rb "$tap/Formula/ccm.rb"
          brew install ccm/release-check/ccm
          brew test ccm/release-check/ccm
          brew uninstall ccm/release-check/ccm
      - name: Commit the synchronized release
        if: steps.latest.outputs.update == 'true'
        shell: bash
        env:
          CCM_TAG: ${{ steps.latest.outputs.tag }}
        run: |
          set -euo pipefail
          printf '%s\n' "$CCM_TAG" > RELEASE_TAG
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Formula/ccm.rb RELEASE_TAG
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "ccm: update to ${CCM_TAG#v}"
          git push origin HEAD:main
